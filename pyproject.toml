[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pvmission"
version = "0.1.1"
description = "Physics-based drone mission planning for thermal inspection of solar PV plants: irradiance window, resolution, viewing angle and sun-glare avoidance, exported to ArduPilot and QGroundControl"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammed Alfandi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=2.0", "pvlib>=0.11", "pyyaml>=6"]
keywords = ["drone", "uav", "solar", "photovoltaic", "thermography", "mission-planning", "ardupilot"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
sitl = ["pymavlink>=2.4"]
dev = ["pytest>=7", "ruff==0.16.8", "matplotlib>=3.6", "pymavlink>=2.4", "geographiclib>=2"]

[project.urls]
Homepage = "https://github.com/Mohammedgmail/pv-drone-inspection-planner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
